setup:
  go: "off"
  python: "3.11"
  nodesource: "off"
  php: "off"
  ruby: "off"
  permissions: regular
build:
  commands:
    - pip install -r backend/requirements.txt
meta:
  module: naumenko-ps/amvera-runtime-python
  runtime: python3.11
run:
  type: python
  path: app.py
  shell: false
port: 8080
environment:
  - name: APP_TITLE
    value: "Наука · Контур 1"
